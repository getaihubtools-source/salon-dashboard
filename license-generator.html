<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AIhub License Generator</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;min-height:100vh;font-family:Tahoma,Arial,sans-serif;
  color:#fff;background:#120B24;
  display:flex;align-items:center;justify-content:center;padding:24px;
}
body:before{
  content:"";position:fixed;inset:0;pointer-events:none;
  background:
    radial-gradient(circle at 15% 20%,rgba(138,43,226,.22),transparent 32%),
    radial-gradient(circle at 85% 80%,rgba(0,229,255,.12),transparent 30%);
}
.card{
  position:relative;width:min(520px,100%);padding:30px;
  background:rgba(27,18,51,.94);border:1px solid rgba(138,43,226,.35);
  border-radius:22px;box-shadow:0 20px 60px rgba(0,0,0,.45);
}
.brand{font-size:25px;font-weight:800;margin-bottom:4px}
.brand span{color:#00E5FF}
.sub{color:#B8B0CC;font-size:13px;margin-bottom:25px}
label{display:block;font-size:13px;color:#D9D2E8;margin:15px 0 7px}
input,select{
  width:100%;border:1px solid #3b2b5c;border-radius:12px;
  background:#120B24;color:#fff;padding:13px;font-size:14px;outline:none;
}
input:focus,select:focus{border-color:#8A2BE2;box-shadow:0 0 0 3px rgba(138,43,226,.12)}
button{
  width:100%;margin-top:22px;padding:14px;border:0;border-radius:12px;
  color:#fff;font-weight:700;font-size:15px;cursor:pointer;
  background:linear-gradient(135deg,#8A2BE2,#5d31c7);
}
button:disabled{opacity:.6;cursor:wait}
.result{display:none;margin-top:20px;padding:18px;border-radius:15px;background:#120B24;border:1px solid #3b2b5c}
.result.ok{border-color:rgba(0,229,255,.45)}
.result.err{border-color:rgba(255,89,246,.45)}
.caption{font-size:12px;color:#B8B0CC;margin-bottom:8px}
.code{direction:ltr;text-align:center;font-family:Consolas,monospace;font-size:22px;font-weight:800;letter-spacing:1px;color:#00E5FF;word-break:break-all}
.copy{
  margin-top:12px;padding:10px;background:#24163f;border:1px solid #4a3271;
  border-radius:10px;text-align:center;font-size:13px;cursor:pointer
}
.msg{font-size:13px;line-height:1.8}
.footer{text-align:center;color:#75698c;font-size:11px;margin-top:20px}
</style>
</head>
<body>
<main class="card">
  <div class="brand">AIhub <span>Tools</span></div>
  <div class="sub">License Generator · پنل مدیریت لایسنس</div>

  <label>محصول</label>
  <select id="product">
    <option value="salon-dashboard">داشبورد مدیریت سالن</option>
  </select>

  <label>نام مشتری</label>
  <input id="customer" placeholder="مثلاً: مریم احمدی">

  <label>شماره سفارش</label>
  <input id="order" placeholder="مثلاً: 1001">

  <label>کلید ادمین</label>
  <input id="key" type="password" autocomplete="off" placeholder="ADMIN_KEY">

  <button id="btn" onclick="generate()">تولید کد لایسنس</button>

  <section id="result" class="result">
    <div class="caption">کد لایسنس تولیدشده</div>
    <div id="code" class="code"></div>
    <div class="copy" onclick="copyCode()">کپی کد</div>
    <div id="msg" class="msg"></div>
  </section>

  <div class="footer">AIhub Tools · License Management</div>
</main>

<script>
const API="https://aihub-license.get-aihubtools.workers.dev";

async function generate(){
  const btn=document.getElementById("btn");
  const box=document.getElementById("result");
  const code=document.getElementById("code");
  const msg=document.getElementById("msg");
  const key=document.getElementById("key").value.trim();

  box.style.display="block";
  box.className="result";
  code.textContent="";
  msg.textContent="در حال تولید...";
  btn.disabled=true;

  try{
    if(!key) throw new Error("کلید ادمین را وارد کنید.");

    const res=await fetch(API,{
      method:"POST",
      headers:{
        "Content-Type":"application/json",
        "Authorization":"Bearer "+key
      },
      body:JSON.stringify({
        action:"generate",
        product:document.getElementById("product").value,
        customer:document.getElementById("customer").value.trim(),
        order:document.getElementById("order").value.trim()
      })
    });

    const data=await res.json();

    if(!res.ok || !data.success)
      throw new Error(data.message || "تولید لایسنس انجام نشد.");

    box.className="result ok";
    code.textContent=data.license;
    msg.textContent="لایسنس با موفقیت ایجاد و در سیستم ذخیره شد.";
  }catch(e){
    box.className="result err";
    msg.textContent=e.message || "خطا در اتصال به سرور.";
  }finally{
    btn.disabled=false;
  }
}

async function copyCode(){
  const code=document.getElementById("code").textContent;
  if(!code)return;
  try{
    await navigator.clipboard.writeText(code);
    document.querySelector(".copy").textContent="کپی شد ✓";
    setTimeout(()=>document.querySelector(".copy").textContent="کپی کد",1500);
  }catch{
    alert("کپی خودکار انجام نشد.");
  }
}
</script>
</body>
</html>
