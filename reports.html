<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#14121A" />
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png" />
<link rel="icon" href="assets/icons/icon-192.png" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="مدیریار سالن" />
<title>تحلیل عملکرد | Beauty Salon Intelligence Dashboard</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" />
<link rel="stylesheet" href="css/variables.css" />
<link rel="stylesheet" href="css/layout.css" />
<link rel="stylesheet" href="css/tables.css" />
<link rel="stylesheet" href="css/components.css" />
<link rel="stylesheet" href="css/charts.css" />
</head>
<body>

<div class="app-shell">
  <main class="main">
    <div class="page-header">
      <div>
        <h1>تحلیل عملکرد</h1>
        <div class="page-header__subtitle">تحلیل مالی، رتبه‌بندی تیم سالن، سودآوری خدمات و سگمنت مشتریان</div>
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;">
        <button class="btn btn-ghost" onclick="window.print()">چاپ گزارش</button>
        <button class="btn btn-ghost" onclick="exportReportsToExcel()">خروجی اکسل</button>
      </div>
    </div>

    <div id="rangeBarSlot"></div>
    <div id="kpiSlot" class="kpi-grid"></div>

    <h2 style="font-size:18px;margin:28px 0 12px;">رتبه‌بندی پرسنل</h2>
    <div class="chart-card" id="employeeChartWrap" style="margin-bottom:16px;">
      <div class="chart-card__canvas-wrap"><canvas id="employeeRankingChart"></canvas></div>
    </div>
    <div id="employeeRankingSlot"></div>

    <h2 style="font-size:18px;margin:28px 0 12px;">سودآوری خدمات</h2>
    <div id="serviceProfitSlot"></div>

    <h2 style="font-size:18px;margin:28px 0 12px;">سگمنت‌بندی مشتریان</h2>
    <div id="segmentKpiSlot" class="kpi-grid"></div>
    <div class="chart-card" id="segmentChartWrap" style="max-width:480px;margin-bottom:28px;">
      <div class="chart-card__canvas-wrap"><canvas id="segmentChart"></canvas></div>
    </div>

    <h2 style="font-size:18px;margin:0 0 12px;">مشتریان نیازمند پیگیری</h2>
    <div id="followUpSlot"></div>
  </main>

  <div id="sidebarSlot"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="js/license.js"></script>
<script src="js/utils.js"></script>
<script src="js/db.js"></script>
<script src="js/components.js"></script>
<script src="js/charts.js"></script>
<script src="js/datepicker.js"></script>
<script src="js/reports.js"></script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('service-worker.js').catch(() => {});
    });
  }
</script>
</body>
</html>
