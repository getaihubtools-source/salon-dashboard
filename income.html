<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#14121A" />
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png" />
<link rel="icon" href="assets/icons/icon-192.png" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="مدیریار سالن" />
<title>درآمد | Beauty Salon Intelligence Dashboard</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" />
<link rel="stylesheet" href="css/variables.css" />
<link rel="stylesheet" href="css/layout.css" />
<link rel="stylesheet" href="css/tables.css" />
<link rel="stylesheet" href="css/components.css" />
<link rel="stylesheet" href="css/charts.css" />
</head>
<body>

<div class="app-shell">
  <main class="main">
    <div class="page-header">
      <div>
        <h1>درآمد</h1>
        <div class="page-header__subtitle">تراکنش‌های درآمدی، تفکیک بر اساس خدمت و روش پرداخت</div>
      </div>
      <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
        <button class="btn btn-ghost" onclick="window.print()">چاپ گزارش</button>
        <button class="btn btn-ghost" onclick="exportIncomeToExcel()">خروجی اکسل</button>
        <button class="btn btn-primary" onclick="addTransaction()">+ ثبت تراکنش</button>
      </div>
    </div>

    <div id="rangeBarSlot"></div>
    <div id="kpiSlot" class="kpi-grid"></div>
    <div id="filterBarSlot"></div>

    <div class="chart-grid">
      <div class="chart-card">
        <div class="chart-card__title">درآمد به تفکیک خدمت</div>
        <div class="chart-card__canvas-wrap"><canvas id="incomeByServiceChart"></canvas></div>
      </div>
      <div class="chart-card">
        <div class="chart-card__title">سهم روش پرداخت</div>
        <div class="chart-card__canvas-wrap"><canvas id="incomeByMethodChart"></canvas></div>
      </div>
    </div>

    <div id="tableSlot"></div>
  </main>

  <div id="sidebarSlot"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="js/license.js"></script>
<script src="js/utils.js"></script>
<script src="js/db.js"></script>
<script src="js/components.js"></script>
<script src="js/charts.js"></script>
<script src="js/datepicker.js"></script>
<script src="js/income.js"></script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('service-worker.js').catch(() => {});
    });
  }
</script>
</body>
</html>
