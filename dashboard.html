<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#14121A" />
<meta name="color-scheme" content="dark" />
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png" />
<link rel="icon" href="assets/icons/icon-192.png" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="مدیریار سالن" />
<title>داشبورد | Beauty Salon Intelligence Dashboard</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" />
<link rel="stylesheet" href="css/variables.css" />
<link rel="stylesheet" href="css/layout.css" />
<link rel="stylesheet" href="css/tables.css" />
<link rel="stylesheet" href="css/components.css" />
<link rel="stylesheet" href="css/charts.css" />
</head>
<body>

<div class="app-shell">
  <main class="main">
    <div class="dash-header" id="dashHeaderSlot"></div>

    <div id="kpiSlot" class="kpi-grid"></div>

    <div class="chart-card" style="margin-bottom:20px;">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:8px;flex-wrap:wrap;">
        <div class="chart-card__title" style="margin:0;">نوبت‌های امروز</div>
        <a class="btn btn-ghost" href="appointments.html">مشاهده همه نوبت‌ها</a>
      </div>
      <div id="todayApptSlot"></div>
    </div>

    <div class="chart-grid">
      <div class="chart-card">
        <div class="chart-card__title">روند ۶ ماه اخیر — درآمد در برابر هزینه</div>
        <div class="chart-card__canvas-wrap"><canvas id="monthlyTrendChart"></canvas></div>
      </div>
      <div class="chart-card" id="topEmployeeWrap">
        <div class="chart-card__title">عملکرد همکاران (این ماه)</div>
        <div class="chart-card__canvas-wrap"><canvas id="topEmployeeChart"></canvas></div>
      </div>
    </div>

    <div class="chart-grid">
      <div class="chart-card" id="loyaltyDistWrap">
        <div class="chart-card__title">توزیع سطح وفاداری مشتریان</div>
        <div class="chart-card__canvas-wrap"><canvas id="loyaltyDistChart"></canvas></div>
      </div>
      <div class="chart-card" id="expenseBreakdownWrap">
        <div class="chart-card__title">سهم هزینه به تفکیک دسته (این ماه)</div>
        <div class="chart-card__canvas-wrap"><canvas id="dashboardExpenseChart"></canvas></div>
      </div>
    </div>
  </main>

  <div id="sidebarSlot"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="js/license.js"></script>
<script src="js/applock.js"></script>
<script src="js/utils.js"></script>
<script src="js/db.js"></script>
<script src="js/components.js"></script>
<script src="js/charts.js"></script>
<script src="js/income.js"></script>
<script src="js/expenses.js"></script>
<script src="js/datepicker.js"></script>
<script src="js/appointments.js"></script>
<script src="js/dashboard.js"></script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('service-worker.js').catch(() => {});
    });
  }
</script>
</body>
</html>
