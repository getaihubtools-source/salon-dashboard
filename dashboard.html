<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#14121A" />
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png" />
<link rel="icon" href="assets/icons/icon-192.png" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="مدیریار سالن" />
<title>داشبورد | Beauty Salon Intelligence Dashboard</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" />
<link rel="stylesheet" href="css/variables.css" />
<link rel="stylesheet" href="css/layout.css" />
<link rel="stylesheet" href="css/tables.css" />
<link rel="stylesheet" href="css/components.css" />
<link rel="stylesheet" href="css/charts.css" />
</head>
<body>

<div class="app-shell">
  <main class="main">
    <div class="page-header">
      <div>
        <h1>داشبورد</h1>
        <div class="page-header__subtitle">دید کلی مالی و عملکردی سالن در یک نگاه</div>
      </div>
      <div style="display:flex;align-items:center;gap:8px;">
        <a class="icon-btn" href="settings.html" title="تنظیمات" aria-label="تنظیمات"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 13.5a1.7 1.7 0 0 0 .34 1.87l.06.06a2.05 2.05 0 1 1-2.9 2.9l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1 1.55V19.6a2.05 2.05 0 1 1-4.1 0v-.09a1.7 1.7 0 0 0-1.1-1.55 1.7 1.7 0 0 0-1.87.34l-.06.06a2.05 2.05 0 1 1-2.9-2.9l.06-.06a1.7 1.7 0 0 0 .34-1.87 1.7 1.7 0 0 0-1.55-1H4.4a2.05 2.05 0 1 1 0-4.1h.09a1.7 1.7 0 0 0 1.55-1.1 1.7 1.7 0 0 0-.34-1.87l-.06-.06a2.05 2.05 0 1 1 2.9-2.9l.06.06a1.7 1.7 0 0 0 1.87.34H10.5a1.7 1.7 0 0 0 1-1.55V4.4a2.05 2.05 0 1 1 4.1 0v.09a1.7 1.7 0 0 0 1 1.55 1.7 1.7 0 0 0 1.87-.34l.06-.06a2.05 2.05 0 1 1 2.9 2.9l-.06.06a1.7 1.7 0 0 0-.34 1.87V10.5a1.7 1.7 0 0 0 1.55 1h.09a2.05 2.05 0 1 1 0 4.1h-.09a1.7 1.7 0 0 0-1.55 1Z"/></svg></a>
        <button class="btn btn-ghost" onclick="exportBackup()">تهیه نسخه پشتیبان</button>
      </div>
    </div>

    <div id="kpiSlot" class="kpi-grid"></div>

    <div class="chart-card" style="margin-bottom:20px;">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:8px;flex-wrap:wrap;">
        <div class="chart-card__title" style="margin:0;">نوبت‌های امروز</div>
        <a class="btn btn-ghost" href="appointments.html">مشاهده همه نوبت‌ها</a>
      </div>
      <div id="todayApptSlot"></div>
    </div>

    <div class="chart-grid">
      <div class="chart-card">
        <div class="chart-card__title">روند ۶ ماه اخیر — درآمد در برابر هزینه</div>
        <div class="chart-card__canvas-wrap"><canvas id="monthlyTrendChart"></canvas></div>
      </div>
      <div class="chart-card" id="topEmployeeWrap">
        <div class="chart-card__title">عملکرد همکاران (این ماه)</div>
        <div class="chart-card__canvas-wrap"><canvas id="topEmployeeChart"></canvas></div>
      </div>
    </div>

    <div class="chart-grid">
      <div class="chart-card" id="loyaltyDistWrap">
        <div class="chart-card__title">توزیع سطح وفاداری مشتریان</div>
        <div class="chart-card__canvas-wrap"><canvas id="loyaltyDistChart"></canvas></div>
      </div>
      <div class="chart-card" id="expenseBreakdownWrap">
        <div class="chart-card__title">سهم هزینه به تفکیک دسته (این ماه)</div>
        <div class="chart-card__canvas-wrap"><canvas id="dashboardExpenseChart"></canvas></div>
      </div>
    </div>
  </main>

  <div id="sidebarSlot"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="js/license.js"></script>
<script src="js/utils.js"></script>
<script src="js/db.js"></script>
<script src="js/components.js"></script>
<script src="js/charts.js"></script>
<script src="js/income.js"></script>
<script src="js/expenses.js"></script>
<script src="js/datepicker.js"></script>
<script src="js/appointments.js"></script>
<script src="js/dashboard.js"></script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('service-worker.js').catch(() => {});
    });
  }
</script>
</body>
</html>
